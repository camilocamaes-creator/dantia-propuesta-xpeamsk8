document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid rgba(166,188,159,.42)\">\n        <span style=\"display:flex;align-items:center;gap:13px\">\n          <svg sc-camel-view-box=\"0 0 40 40\" aria-hidden=\"true\" style=\"width:34px;height:34px;color:#7FA278;flex:none;display:block\"><circle cx=\"20\" cy=\"20\" r=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"><\/circle><path d=\"M12 20.5 17.5 26 28.5 14.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n          <span>\n            <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;color:#F3F1E7;line-height:1;letter-spacing:-.018em\">Dantia<\/span>\n            <span style=\"display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A6BC9F;margin-top:6px\">Automatización para negocios ocupados<\/span>\n          <\/span>\n        <\/span>\n        <span style=\"font-size:14px;color:#A6BC9F\">hola@dantia.ca<\/span>\n      <\/div>\n\n      <div style=\"flex:1 1 auto;min-height:44px\"><\/div>\n\n      <h1 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(40px,8.6vw,104px);line-height:.94;letter-spacing:-.04em;color:#F3F1E7;margin:0;max-width:none;text-wrap:balance\">Propuesta de automatización<\/h1>\n      <p style=\"font-size:clamp(15.5px,1.9vw,20px);line-height:1.45;color:#A6BC9F;margin:18px 0 0;max-width:none\">Recepción, archivo y revisión de los documentos de sus clientes, según lo que conversamos el 7 de septiembre de 2026.<\/p>\n\n      <div style=\"display:flex;gap:clamp(24px,4vw,56px);flex-wrap:wrap;margin-top:clamp(30px,5vw,52px);padding-top:20px;border-top:1px solid rgba(166,188,159,.42)\">\n        <span><span style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A6BC9F;margin-bottom:7px\">Para<\/span><span style=\"font-size:16.5px;color:#F3F1E7;font-weight:500\">Luz Adriana Parra<\/span><\/span>\n        <span><span style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A6BC9F;margin-bottom:7px\">De<\/span><span style=\"display:block;font-size:16.5px;color:#F3F1E7;font-weight:500\">Camilo Camacho Escamilla<\/span><span style=\"display:block;font-size:16.5px;color:#A6BC9F;font-weight:500;margin-top:3px\">Dantia<\/span><\/span>\n        <span><span style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A6BC9F;margin-bottom:7px\">Fecha<\/span><span style=\"font-size:16.5px;color:#F3F1E7;font-weight:500\">15 de septiembre de 2026<\/span><\/span>\n        <span><span style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A6BC9F;margin-bottom:7px\">Vigencia<\/span><span style=\"font-size:16.5px;color:#F3F1E7;font-weight:500\">Hasta el 15 de octubre de 2026<\/span><\/span>\n      <\/div>\n\n      <div style=\"flex:1 1 auto;min-height:40px\"><\/div>\n\n      <span sc-camel-on-click=\"{{ next }}\" style=\"display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:#CF6B3F;color:#FFF8F2;padding:15px 28px;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\" style-hover=\"background:#E07C4E\">\n        Continuar\n        <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:16px;height:16px;flex:none\"><path d=\"M5 12h13M12.5 6 18.5 12 12.5 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n      <\/span>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isGracias }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;display:flex;align-items:center;padding:clamp(40px,8vw,90px) clamp(20px,5vw,72px);animation:rise .4s ease both\">\n    <div style=\"max-width:none;margin:0 auto;width:100%\">\n      <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:18px\">Propuesta<\/span>\n      <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(32px,6.4vw,68px);line-height:1;letter-spacing:-.034em;color:#1F4622;margin:0 0 34px;max-width:none;text-wrap:balance\">Gracias por su interés, Adriana.<\/h2>\n      <div style=\"max-width:none\">\n        <p style=\"font-size:clamp(16px,1.9vw,19px);line-height:1.62;margin-top:0\">A continuación le presento la propuesta, basada en nuestra conversación. Recoge lo que entendí de su trabajo y lo traduce en opciones concretas, cada una con su precio y con lo que implica.<\/p>\n        <p style=\"font-size:clamp(16px,1.9vw,19px);line-height:1.62\">Está organizada para que no tenga que leerla toda. Primero el problema y el camino, después una herramienta para definir el alcance que le interese y ver qué cuesta, y al final el documento completo, sección por sección, para cuando quiera el detalle.<\/p>\n        <p style=\"font-size:clamp(16px,1.9vw,19px);line-height:1.62;margin-bottom:0\">En dos puntos le recomiendo una alternativa más económica que contratarme, y en ambos indico nombres y precios.<\/p>\n        <p style=\"font-size:clamp(16px,1.9vw,19px);line-height:1.62;margin-bottom:0\">Para usarla: en cada bloque marque las opciones que le interesen y el total se irá sumando en “Su selección”. Lo que marque en esta página no me llega ni la compromete; cuando tenga clara su selección, puede escribirme a hola@dantia.ca con los códigos que eligió.<\/p>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:38px;padding-top:24px;border-top:1px solid #E2DACB\">\n        <span sc-camel-on-click=\"{{ next }}\" style=\"display:inline-flex;align-items:center;gap:12px;background:#1F4622;color:#F3F1E7;padding:15px 28px;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\" style-hover=\"background:#2A5A2E\">\n          El problema y el camino\n          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:16px;height:16px;flex:none\"><path d=\"M5 12h13M12.5 6 18.5 12 12.5 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n        <\/span>\n        <span sc-camel-on-click=\"{{ goDetalle }}\" style=\"font-size:14.5px;font-weight:600;color:#6A6252;cursor:pointer\" style-hover=\"color:#A8482A\">Ir directo al documento completo<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isProblema }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;padding:clamp(34px,6vw,70px) clamp(20px,5vw,72px);animation:rise .4s ease both\">\n    <div style=\"max-width:none;margin:0 auto;width:100%\">\n      <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:16px\">Punto de partida<\/span>\n      <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(30px,5.6vw,60px);line-height:1;letter-spacing:-.034em;color:#1F4622;margin:0 0 8px;max-width:none;text-wrap:balance\">El problema y el camino<\/h2>\n      <p style=\"font-size:clamp(15.5px,1.8vw,19px);line-height:1.5;color:#6A6252;margin:0 0 clamp(20px,2.6vw,28px);max-width:none\">Tres trabajos que hoy le consumen tiempo o le cuestan personal, y qué propongo para cada uno.<\/p>\n\n\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(18px,2.6vw,30px);align-items:stretch\">\n\n        <div style=\"background:#F2E6D6;padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;print-color-adjust:exact\">\n          <div style=\"padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid #CF6B3F\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A\">Hoy · lo que me contó en la reunión<\/span>\n          <\/div>\n          <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:clamp(19px,2.4vw,24px);font-weight:700;color:#16331A;letter-spacing:-.02em;line-height:1.15;margin-bottom:22px\">Trabajos operativos de hoy<\/span>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px\">\n            <li style=\"display:flex;gap:13px;align-items:flex-start\"><i style=\"flex:none;width:8px;height:8px;background:#CF6B3F;margin-top:7px\"><\/i><span style=\"font-size:16px;line-height:1.5;color:#2A251C\">Sus clientes le envían los documentos por correo, y alguien tiene que descargarlos, identificar de quién son, clasificarlos y archivarlos en la carpeta correspondiente. En un mismo día pueden escribirle diez clientes.<\/span><\/li>\n            <li style=\"display:flex;gap:13px;align-items:flex-start\"><i style=\"flex:none;width:8px;height:8px;background:#CF6B3F;margin-top:7px\"><\/i><span style=\"font-size:16px;line-height:1.5;color:#2A251C\">Contrata personal para la revisión de nómina y para la exógena, todos los años.<\/span><\/li>\n            <li style=\"display:flex;gap:13px;align-items:flex-start\"><i style=\"flex:none;width:8px;height:8px;background:#CF6B3F;margin-top:7px\"><\/i><span style=\"font-size:16px;line-height:1.5;color:#2A251C\">Llevar a Siigo la información de un cliente que no va a cambiar de programa.<\/span><\/li>\n          <\/ul>\n          <p style=\"margin:22px 0 0;padding-top:16px;border-top:1px solid #D9C7AE;font-size:16px;line-height:1.5;color:#2A251C\">Usted quiere liberar tiempo para estudiar otros temas, y ese es el tiempo que hoy ocupan estas tareas.<\/p>\n        <\/div>\n\n        <div style=\"background:#1F4622;color:#EDEFE8;padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;print-color-adjust:exact\">\n          <div style=\"padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid #7FA278\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A6BC9F\">Con Dantia<\/span>\n          <\/div>\n          <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:clamp(19px,2.4vw,24px);font-weight:700;color:#F3F1E7;letter-spacing:-.02em;line-height:1.15;margin-bottom:22px\">Pasos de una sola cadena<\/span>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px\">\n            <li style=\"display:grid;grid-template-columns:28px 1fr;column-gap:13px\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:800;color:#7FA278;line-height:1.05\">1<\/span><span><span style=\"display:block;font-size:16px;font-weight:600;color:#F3F1E7;line-height:1.3;margin-bottom:4px\">Entra la información<\/span><span style=\"display:block;font-size:15px;line-height:1.5;color:#A6BC9F\">Los documentos llegan y quedan archivados donde van, sin que usted tenga que descargarlos.<\/span><\/span><\/li>\n            <li style=\"display:grid;grid-template-columns:28px 1fr;column-gap:13px\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:800;color:#7FA278;line-height:1.05\">2<\/span><span><span style=\"display:block;font-size:16px;font-weight:600;color:#F3F1E7;line-height:1.3;margin-bottom:4px\">Se revisa contra lo que debería estar<\/span><span style=\"display:block;font-size:15px;line-height:1.5;color:#A6BC9F\">El sistema reconoce qué es cada documento y marca lo que falta o no cuadra.<\/span><\/span><\/li>\n            <li style=\"display:grid;grid-template-columns:28px 1fr;column-gap:13px\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:800;color:#7FA278;line-height:1.05\">3<\/span><span><span style=\"display:block;font-size:16px;font-weight:600;color:#F3F1E7;line-height:1.3;margin-bottom:4px\">Se le informa al cliente<\/span><span style=\"display:block;font-size:15px;line-height:1.5;color:#A6BC9F\">Sale el reporte y el borrador del correo de seguimiento, ya redactado.<\/span><\/span><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <p style=\"margin:clamp(26px,3.4vw,38px) 0 0;padding-top:22px;border-top:3px solid #1F4622;font-family:'Playfair Display',Georgia,serif;font-size:clamp(22px,3.6vw,36px);line-height:1.15;color:#1F4622;font-weight:700;letter-spacing:-.026em;max-width:none;text-wrap:pretty\">Los pasos 2 y 3 dependen del paso 1, por eso le recomiendo seguir el orden de la cadena.<\/p>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(18px,2.6vw,30px);margin-top:clamp(22px,3vw,32px)\">\n        <div style=\"border-top:2px solid #CF6B3F;padding-top:14px\">\n          <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A8482A;margin-bottom:10px\">El paso 2 agrega algo que no conversamos<\/span>\n          <p style=\"margin:0;font-size:clamp(15.5px,1.8vw,19px);line-height:1.55;color:#2A251C\">Identificar qué documentos faltan de cada cliente y dejarle redactado el correo para pedirlos.<\/p>\n        <\/div>\n        <div style=\"border-top:2px solid #C9C0AC;padding-top:14px\">\n          <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#6A6252;margin-bottom:10px\">Aparte de la cadena<\/span>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px\">\n            <li style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;border-bottom:1px solid #E2DACB;padding-bottom:6px\"><span style=\"font-size:15.5px;color:#2A251C\">La revisión de nómina<\/span><span style=\"flex:none;font-size:13px;font-weight:700;letter-spacing:.1em;color:#6A6252\">2B<\/span><\/li>\n            <li style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;border-bottom:1px solid #E2DACB;padding-bottom:6px\"><span style=\"font-size:15.5px;color:#2A251C\">El archivo para Siigo<\/span><span style=\"flex:none;font-size:13px;font-weight:700;letter-spacing:.1em;color:#6A6252\">Bloque 4<\/span><\/li>\n            <li style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\"><span style=\"font-size:15.5px;color:#2A251C\">La exógena, con programas existentes desde unos $120.000<\/span><span style=\"flex:none;font-size:13px;font-weight:700;letter-spacing:.1em;color:#6A6252\">Bloque 6<\/span><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <p style=\"margin:clamp(20px,2.6vw,28px) 0 0;font-size:clamp(15.5px,1.8vw,19px);line-height:1.6;color:#6A6252;max-width:none\">En las páginas siguientes usted define el alcance bloque por bloque. En cada uno toque la opción que le interese; los bloques 2, 3 y 4 son opcionales. Cada selección se suma en el recuadro “Su selección”, con la implementación (pago único) y la mensualidad, y en la última pantalla verá el precio completo y el costo del primer año.<\/p>\n\n      <div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:42px;padding-top:24px;border-top:1px solid #E2DACB\">\n        <span sc-camel-on-click=\"{{ next }}\" style=\"display:inline-flex;align-items:center;gap:12px;background:#1F4622;color:#F3F1E7;padding:15px 28px;font-size:15.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\" style-hover=\"background:#2A5A2E\">\n          Armar mi selección\n          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:16px;height:16px;flex:none\"><path d=\"M5 12h13M12.5 6 18.5 12 12.5 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n        <\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isPrecio }}\" hint-pla soportes<\/span>\n      <\/sc-if>\n    <\/span>\n    <span sc-camel-on-click=\"{{ on_f6 }}\" style=\"display:grid;grid-template-columns:18px 1fr;column-gap:8px;align-items:baseline;padding:5px 10px 5px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n      <span style=\"font-size:12.5px;font-weight:700;color:#A8482A;line-height:1.35\">6<\/span>\n      <sc-if value=\"{{ show_f6 }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:13.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-8px 0 0 0 #CF6B3F\">Información exógena<\/span>\n      <\/sc-if>\n      <sc-if value=\"{{ hide_f6 }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"font-size:13.5px;line-height:1.35;color:#6A6252\">Información exógena<\/span>\n      <\/sc-if>\n    <\/span>\n  <\/div>\n  <span sc-camel-on-click=\"{{ on_sec5 }}\" style=\"display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:baseline;padding:7px 10px 7px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n    <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:15.5px;font-weight:800;color:#CF6B3F;line-height:1.2\">5<\/span>\n    <sc-if value=\"{{ show_sec5 }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-10px 0 0 0 #CF6B3F\">La mensualidad<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{ hide_sec5 }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#16331A;font-weight:500\">La mensualidad<\/span>\n    <\/sc-if>\n  <\/span>\n  <span sc-camel-on-click=\"{{ on_sec6 }}\" style=\"display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:baseline;padding:7px 10px 7px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n    <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:15.5px;font-weight:800;color:#CF6B3F;line-height:1.2\">6<\/span>\n    <sc-if value=\"{{ show_sec6 }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-10px 0 0 0 #CF6B3F\">Recomendación sobre por dónde empezar<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{ hide_sec6 }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#16331A;font-weight:500\">Recomendación sobre por dónde empezar<\/span>\n    <\/sc-if>\n  <\/span>\n  <span sc-camel-on-click=\"{{ on_sec7 }}\" style=\"display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:baseline;padding:7px 10px 7px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n    <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:15.5px;font-weight:800;color:#CF6B3F;line-height:1.2\">7<\/span>\n    <sc-if value=\"{{ show_sec7 }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-10px 0 0 0 #CF6B3F\">Qué necesito de usted<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{ hide_sec7 }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#16331A;font-weight:500\">Qué necesito de usted<\/span>\n    <\/sc-if>\n  <\/span>\n  <span sc-camel-on-click=\"{{ on_sec8 }}\" style=\"display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:baseline;padding:7px 10px 7px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n    <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:15.5px;font-weight:800;color:#CF6B3F;line-height:1.2\">8<\/span>\n    <sc-if value=\"{{ show_sec8 }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-10px 0 0 0 #CF6B3F\">Qué no incluye<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{ hide_sec8 }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#16331A;font-weight:500\">Qué no incluye<\/span>\n    <\/sc-if>\n  <\/span>\n  <span sc-camel-on-click=\"{{ on_sec9 }}\" style=\"display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:baseline;padding:7px 10px 7px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n    <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:15.5px;font-weight:800;color:#CF6B3F;line-height:1.2\">9<\/span>\n    <sc-if value=\"{{ show_sec9 }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-10px 0 0 0 #CF6B3F\">Condiciones<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{ hide_sec9 }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#16331A;font-weight:500\">Condiciones<\/span>\n    <\/sc-if>\n  <\/span>\n  <span sc-camel-on-click=\"{{ on_sec10 }}\" style=\"display:grid;grid-template-columns:26px 1fr;column-gap:10px;align-items:baseline;padding:7px 10px 7px 0;margin-left:-10px;padding-left:10px;cursor:pointer\" style-hover=\"background:#F1EDE2\">\n    <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:15.5px;font-weight:800;color:#CF6B3F;line-height:1.2\">10<\/span>\n    <sc-if value=\"{{ show_sec10 }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#A8482A;font-weight:700;box-shadow:-10px 0 0 0 #CF6B3F\">Próximos pasos<\/span>\n    <\/sc-if>\n    <sc-if value=\"{{ hide_sec10 }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:14.5px;line-height:1.35;color:#16331A;font-weight:500\">Próximos pasos<\/span>\n    <\/sc-if>\n  <\/span>\n<\/div>\n\n<div style=\"margin-top:18px;padding-top:14px;border-top:1px solid #E2DACB\">\n  <span sc-camel-on-click=\"{{ goPrecio }}\" style=\"display:block;font-size:14px;font-weight:600;color:#1F4622;cursor:pointer;padding:5px 0\" style-hover=\"color:#A8482A\">← Volver al estimador<\/span>\n<\/div>\n      <\/aside>\n\n      <div style=\"flex:1 1 380px;min-width:0\">\n        <sc-if value=\"{{ show_sec1 }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 1<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Lo que entendí de nuestra conversación<\/h2>\n<p>Usted atiende varias entidades y hace sola buena parte del trabajo. Una parte importante de su tiempo se concentra en lo que viene antes del criterio profesional, que es lo que sus clientes le pagan: descargar, clasificar y archivar lo que le envían.<\/p>\n<p>El ejemplo que me dio fue claro: diez correos de diez clientes distintos en un mismo día, todos para revisión de impuestos, y usted descargando y archivando uno por uno. Lo que pidió fue un asistente que le diga qué llegó y que lo deje guardado donde va.<\/p>\n<p>También me habló de otros temas:<\/p>\n<ul>\n  <li>El informe de un cliente, que se prepara en una plantilla de Excel cuya estructura no cambia de un período a otro. La gerente de ese cliente preparó un dashboard subiendo un Excel a Claude.<\/li>\n  <li>La información exógena, para la que contrata personal todos los años, preparando los formatos de la DIAN a partir del balance de prueba por terceros.<\/li>\n  <li>La revisión de nómina y seguridad social, para la que también contrata a alguien, cruzando afiliaciones y cotizaciones contra la información del cliente.<\/li>\n  <li>La información de un cliente que trabaja en Siigo y no va a cambiar de programa.<\/li>\n  <li>Plantillas para informes de auditoría y presentaciones para juntas. No las incluí en esta propuesta; si le interesan, las vemos después de los primeros bloques.<\/li>\n<\/ul>\n<p>Y me planteó dos preocupaciones. Una, que hay clientes a los que no les gusta que su información pase por una inteligencia artificial. La otra, mencionada de pasada, que si se automatiza todo podría quedarse sin trabajo.<\/p>\n\n<div style=\"background:#E4EDE1;padding:22px 26px;margin:22px 0;break-inside:avoid;page-break-inside:avoid\">\n  <p style=\"margin:0 0 10px\">A la segunda respondo aquí: la automatización se ocupa del trabajo operativo, y usted me dijo que quiere liberar tiempo para estudiar otros temas. Ese es el tiempo que esta propuesta busca devolverle.<\/p>\n  <p style=\"margin:0\">La primera la respondo en detalle en la sección 3.<\/p>\n<\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec2 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 2<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Cómo funciona y qué no hace<\/h2>\n<p>Presento esta sección al comienzo porque es la más importante para su trabajo como revisora fiscal.<\/p>\n<div style=\"display:grid;grid-template-columns:96px 1fr;column-gap:24px;margin:26px 0 24px;break-inside:avoid;page-break-inside:avoid\">\n  <span style=\"border-top:3px solid #CF6B3F;padding-top:11px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A\">En una frase<\/span>\n  <div style=\"border-top:3px solid #1F4622;padding-top:11px\">\n    <p style=\"font-family:'Playfair Display',Georgia,serif;font-size:25px;line-height:1.24;color:#1F4622;font-weight:700;letter-spacing:-.02em;margin:0 0 12px;max-width:none\">El sistema prepara la información, la cruza y señala diferencias. No emite juicios de auditoría ni conclusiones.<\/p>\n    <p style=\"margin:0\">Usted revisa y firma, igual que hoy. El dictamen y las conclusiones siguen siendo suyos y nada de lo que le entregue cambia eso.<\/p>\n  <\/div>\n<\/div>\n<p>Tres cosas más que quiero dejar dichas:<\/p>\n<p>Al principio tendrá que revisar cada resultado, porque así se ajusta el sistema. Usted me indica qué quedó mal y yo ajusto las reglas y las instrucciones, sin entrenar ningún modelo con sus documentos, de manera que la revisión se va reduciendo a medida que se acumulan correcciones. Por eso los plazos de cada bloque vienen partidos en dos: cuánto tarda la primera versión en funcionar y cuánto dura el ajuste con sus observaciones.<\/p>\n<p>Todo lo que produzca queda fechado y trazable. Si usted necesita sustentar de dónde salió un dato, va a poder mostrarlo.<\/p>\n<p>Usted decide hasta dónde llega la automatización. Si hay un paso que prefiere seguir haciendo a mano, el sistema llega hasta ahí y no más.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec3 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 3<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Manejo de la información<\/h2>\n<p>Usted tiene una obligación de reserva sobre la información de sus clientes. El diseño parte de esa obligación.<\/p>\n<ul>\n  <li>No necesito acceso a su bandeja de correo personal. La información entra por una dirección creada para esto y, si toma la opción 1B, también por la página de carga. En ninguno de los dos casos tengo acceso al resto de su correo.<\/li>\n  <li>Los documentos quedan en su Drive, en la estructura de carpetas que ya usa. El sistema entra únicamente a la carpeta de clientes que usted comparta con él, y usted le retira el acceso dejando de compartirla. Como administrador, yo puedo ver esa carpeta, y la abro solo para corregir fallas o cuando usted me lo pida. La recepción y el procesamiento corren en una plataforma que yo administro y pago, diseñada para varios clientes y con la información de cada uno separada. En ella se guarda el registro de lo recibido (remitente, nombre del archivo, carpeta y fecha), la lista de clientes con sus correos y, según los bloques que tome, el estado del checklist (2A) y las cifras del dashboard (3B). Los documentos pasan por la plataforma y por el servicio que recibe el correo solo mientras se archivan en su Drive. Si sus carpetas están en un servicio distinto de Google Drive, le confirmo antes de empezar cómo se limita el acceso. La 1A no usa inteligencia artificial: reconoce a cada cliente por la lista de remitentes.<\/li>\n  <li>Usted define qué clientes entran. Si hay alguno que prefiere dejar por fuera, se deja por fuera y se sigue manejando como hoy.<\/li>\n  <li>Usted define qué pasa por un modelo de inteligencia artificial y qué no. Hay pasos que no lo necesitan. En los que sí, le muestro exactamente qué información se envía antes de que decidamos.<\/li>\n  <li>En los pasos que usan inteligencia artificial uso el servicio empresarial de Anthropic (Claude), cuyas condiciones excluyen usar los datos enviados para entrenar modelos.<\/li>\n  <li>Si toma la página de carga, los archivos viajan cifrados y se archivan en su Drive. Cada cliente tiene su propio enlace, y anulo cualquier enlace el mismo día en que usted me lo pida. La página de carga no muestra ni lista información de nadie. Si toma la opción 3B, el dashboard sí muestra cifras, y por eso pide, además del enlace, un código que llega al correo registrado del cliente.<\/li>\n  <li>Accesos revocables. Usted le retira al sistema el acceso a su carpeta cuando quiera, sin depender de mí.<\/li>\n  <li>Acuerdo de tratamiento de datos. Si trabajamos juntos, yo actuaría como encargado del tratamiento de la información personal que se procese, y el acuerdo queda firmado antes de que usted me envíe información de sus clientes. Le envío un borrador con los proveedores que intervienen, dónde se procesa la información y qué se borra al terminar, para que usted lo ajuste a lo que exigen sus contratos con sus clientes. Al terminar el acuerdo, borro de la plataforma los datos de sus clientes dentro de los 30 días siguientes y se lo confirmo por escrito.<\/li>\n<\/ul>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec4 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 4<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Los bloques, con opciones para cada uno<\/h2>\n<p>Antes de la lista, conviene ver cómo se relacionan los seis bloques.<\/p>\n<p>Hay una sola cadena, y son tres pasos:<\/p>\n<ol>\n  <li>Entra la información. Los documentos de sus clientes llegan y quedan archivados donde van, sin que usted tenga que descargarlos. <em>(bloque 1)<\/em><\/li>\n  <li>Se revisa contra lo que debería estar. El sistema reconoce qué es cada documento, lo compara contra el criterio que usted defina, y marca lo que falta o no cuadra. <em>(bloque 2, en dos versiones: documentos de clientes, y nómina)<\/em><\/li>\n  <li>Se le informa al cliente. El sistema prepara el reporte y el borrador del correo de seguimiento, para que usted no tenga que llevar la cuenta de lo que falta ni redactar el correo. <em>(Incluido en el bloque 2; el bloque 3 agrega el dashboard.)<\/em><\/li>\n<\/ol>\n<p>El paso 1 resuelve lo que usted pidió, y los pasos 2 y 3 se apoyan en él. Por eso la recomendación es empezar por el bloque 1 y avanzar la cadena cuando lo considere conveniente.<\/p>\n<p>Aparte de la cadena hay dos herramientas para trabajos puntuales: el archivo para cargar a Siigo <em>(bloque 4)<\/em>, cuyo precio supone el bloque 1, y la revisión de impuestos <em>(bloque 5)<\/em>, con la misma mecánica del bloque 2. Para la exógena le recomiendo una herramienta existente en lugar de contratarme <em>(bloque 6)<\/em>.<\/p>\n<p>No es necesario tomarlos todos. Le describo cada opción por lo que pasaría en la práctica, paso a paso, para que se lo pueda imaginar antes de decidir.<\/p>\n\n<div style=\"margin:24px 0;break-inside:avoid;page-break-inside:avoid\">\n  <sc-raw-table>\n    <sc-raw-caption style=\"caption-side:top;text-align:left;padding:0 0 10px\">\n      <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:17.5px;font-weight:700;color:#16331A;letter-spacing:-.014em;line-height:1.2\">Los seis bloques y el estado de cada precio<\/span>\n      <span style=\"display:block;font-size:13px;color:#6A6252;line-height:1.4;margin-top:4px\">Valores de implementación. Abra cada bloque en el índice para el detalle.<\/span>\n    <\/sc-raw-caption>\n    <sc-raw-thead><sc-raw-tr><sc-raw-th>Bloque<\/sc-raw-th><sc-raw-th style=\"width:70px\">Opciones<\/sc-raw-th><sc-raw-th style=\"width:120px\">Desde<\/sc-raw-th><sc-raw-th style=\"width:150px\">Estado del precio<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td>1. Recepción y organización de documentos<\/sc-raw-td><sc-raw-td>2<\/sc-raw-td><sc-raw-td><strong>COP $1.000.000<\/strong><\/sc-raw-td><sc-raw-td>En firme<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>2. Revisión contra checklist<\/sc-raw-td><sc-raw-td>2<\/sc-raw-td><sc-raw-td><strong>COP $1.500.000<\/strong><\/sc-raw-td><sc-raw-td>En firme<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>3. Informes y dashboard<\/sc-raw-td><sc-raw-td>2<\/sc-raw-td><sc-raw-td><strong>COP $800.000<\/strong><\/sc-raw-td><sc-raw-td>Sujeto a ver su plantilla<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>4. Archivo para cargar a Siigo<\/sc-raw-td><sc-raw-td>2<\/sc-raw-td><sc-raw-td><strong>COP $1.500.000<\/strong><\/sc-raw-td><sc-raw-td>En firme<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>5. Revisión de impuestos contra soportes<\/sc-raw-td><sc-raw-td>ver detalle<\/sc-raw-td><sc-raw-td>por definir<\/sc-raw-td><sc-raw-td>Necesito sus parámetros<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>6. Información exógena<\/sc-raw-td><sc-raw-td>ninguna, ver detalle<\/sc-raw-td><sc-raw-td>ya existe software desde unos $120.000<\/sc-raw-td><sc-raw-td>Sin cotización<\/sc-raw-td><\/sc-raw-tr>\n    <\/sc-raw-tbody>\n  <\/sc-raw-table>\n<\/div>\n\n<p>Los valores de cada bloque son de implementación. La mensualidad se cobra en un solo valor, que aumenta con los bloques en operación: lo que cueste operar todo junto está en la sección 5.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec5 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 5<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">La mensualidad<\/h2>\n<p><\/p>\n<p>En resumen: la mensualidad paga que el sistema funcione todos los días y que haya alguien pendiente de detectar y corregir las fallas que no generan aviso. En la opción 1A son $300.000 al mes, de los cuales estimo que entre $40.000 y $100.000 corresponden a la parte de la plataforma compartida que usa su operación, y el resto a mi seguimiento.<\/p>\n<p>Es posible que le llame la atención que en un año la mensualidad sume más que la implementación: $1.000.000 de implementación contra $3.600.000 al año. Es habitual pagar mensualidades por software sin haber pagado su desarrollo. Lo particular de esta propuesta es que además haya que implementar algo, porque el sistema se hace a su medida en lugar de ser un programa genérico que se ajuste solo parcialmente a su forma de trabajar.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">El sistema opera de forma continua<\/h4>\n<p>Un programa convencional se instala una vez. Lo que le propongo se conecta todos los días con su correo y con su Drive, que son servicios de otras empresas y cambian sin previo aviso. Cuando una de esas conexiones falla, normalmente no aparece ningún error: el sistema deja de archivar y lo demás parece funcionar con normalidad. Sin seguimiento, una falla así puede pasar inadvertida durante días. La mensualidad paga que alguien la detecte y la corrija.<\/p>\n<p><\/p>\n<p><\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Destino de la mensualidad, con cifras<\/h4>\n<p>De los $300.000 de la opción 1A:<\/p>\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Parte estimada de la plataforma compartida: recepción de correo, servidor y almacenamiento<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">$40.000 a $100.000, según el volumen<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">El resto<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">monitoreo de fallas, correcciones y cambios<\/span><\/div>\n  <\/div>\n<\/div>\n\n<p>En la 1B sube a $450.000, porque se suman el servidor y el monitoreo de la página de carga que usan sus clientes.<\/p>\n<p>Le presento el desglose para que vea qué parte corresponde a servicios de terceros y qué parte a mi trabajo. La parte variable sube y baja con lo que llegue; si un mes llega el doble de lo previsto, ese costo corre por mi cuenta.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Mensualidad según el alcance<\/h4>\n<p>La mensualidad se cobra en un solo valor: la suma de los bloques con mensualidad que tenga en operación. La 2B y el bloque 4 no llevan mensualidad y no la cambian.<\/p>\n\n<div style=\"margin:20px 0;break-inside:avoid;page-break-inside:avoid\">\n  <sc-raw-table>\n    <sc-raw-caption style=\"caption-side:top;text-align:left;padding:0 0 10px\">\n      <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:17.5px;font-weight:700;color:#16331A;letter-spacing:-.014em;line-height:1.2\">Cómo se compone la mensualidad<\/span>\n      <span style=\"display:block;font-size:13px;color:#6A6252;line-height:1.4;margin-top:4px\"><\/span>\n    <\/sc-raw-caption>\n    <sc-raw-thead><sc-raw-tr><sc-raw-th><\/sc-raw-th><sc-raw-th style=\"width:170px;text-align:right\">Mensualidad<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td><strong>Bloque 1, opción 1A<\/strong><\/sc-raw-td><sc-raw-td style=\"text-align:right\"><strong>COP $300.000<\/strong><\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td><strong>Bloque 1, opción 1B<\/strong><\/sc-raw-td><sc-raw-td style=\"text-align:right\"><strong>COP $450.000<\/strong><\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Se le suma el checklist de documentos (2A)<\/sc-raw-td><sc-raw-td style=\"text-align:right\">+ $150.000<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>Se le suman los informes y dashboard (bloque 3)<\/sc-raw-td><sc-raw-td style=\"text-align:right\">+ $300.000<\/sc-raw-td><\/sc-raw-tr>\n    <\/sc-raw-tbody>\n  <\/sc-raw-table>\n<\/div>\n\n<p>Con la implementación pagada al inicio, la mensualidad máxima es de $900.000.<\/p>\n<p>La opción 2B y el bloque 4 no llevan mensualidad, porque son revisiones que usted ejecuta cuando las necesita, mientras que los demás bloques funcionan todos los días. Cada uno incluye 6 meses de soporte y después un mantenimiento anual opcional de $500.000.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Qué cubre, en concreto<\/h4>\n<p>Le detallo qué incluye y qué no, para que el alcance quede definido desde ahora.<\/p>\n<p>Incluido:<\/p>\n<ul>\n  <li>Toda la operación. Procesamiento, servidor y lo que cueste mantener el sistema funcionando, hasta 1.500 documentos al mes. La plataforma está a mi nombre, y la administro y la pago yo mientras la mensualidad esté vigente.<\/li>\n  <li>Monitoreo de fallas. El sistema me avisa cuando algo falla, para corregirlo en lo posible antes de que usted lo note.<\/li>\n  <li>Corrección de fallas, sin costo. Si su proveedor de correo o Google hacen un cambio, o si un cliente empieza a enviar un formato que no habíamos visto, lo corrijo sin entrar a determinar a quién se debió la falla.<\/li>\n  <li>Corrección de la clasificación. Usted me indica qué quedó mal archivado y yo lo ajusto; con esas correcciones, la clasificación se va afinando.<\/li>\n  <li>Cambios pequeños. Un cliente nuevo, una categoría de documento nueva, cambiar el texto del acuse de recibo, mover una carpeta, cambiar la hora del resumen diario.<\/li>\n  <li>Un informe mensual. Cuántos documentos entraron, de qué clientes, cuántos quedaron sin clasificar y qué se corrigió. Para que vea qué está haciendo el sistema sin tener que confiar en mi palabra.<\/li>\n  <li>Respuesta dentro del día hábil siguiente, y lo urgente el mismo día.<\/li>\n<\/ul>\n<p>No incluido, se cotiza aparte:<\/p>\n<ul>\n  <li>Un bloque nuevo de los de la sección 4.<\/li>\n  <li>Una entrada nueva, por ejemplo recibir documentos por WhatsApp.<\/li>\n  <li>Conectar un sistema que hoy no está en el alcance.<\/li>\n  <li>Rehacer la lógica de clasificación porque cambió de raíz su forma de trabajar.<\/li>\n  <li>Un volumen sostenido muy por encima de los 1.500 documentos al mes. Si eso ocurre, se lo informo antes de ajustar cualquier valor.<\/li>\n<\/ul>\n<p><\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Comparación con la alternativa de contratar personal<\/h4>\n<p>Es natural comparar esta propuesta con la opción de contratar a alguien. Le dejo mis números completos para que la comparación se haga con datos.<\/p>\n<p>Si toma la opción 1A: primer año COP $1.000.000 más $300.000 por 12 meses, para un total de $4.600.000. De ahí en adelante, $3.600.000 al año.<\/p>\n<p>Si prefiere no hacer un pago inicial, son $420.000 al mes el primer año ($5.040.000) y de ahí en adelante la mensualidad normal.<\/p>\n<p><\/p>\n<p>Si con el tiempo toma todos los bloques, la mensualidad llega hasta $900.000. Eso son $10.800.000 al año, más hasta $1.000.000 de mantenimiento anual si decide tomarlo para la 2B y el bloque 4. No es necesario llegar a ese alcance, ni de entrada ni más adelante.<\/p>\n<p>Le sugiero comparar esas cifras con lo que le cuesta hoy una persona con prestaciones y con lo que paga al personal que contrata para la revisión de nómina. Si la cuenta no le resulta favorable, dígamelo y no seguimos adelante; es mejor para los dos saberlo ahora.<\/p>\n<p>Dos cosas que esa cuenta no refleja, y se las dejo para que las pese usted:<\/p>\n<ul>\n  <li>A una persona hay que dirigirla. Usted me dijo que hace muchas cosas sola y que lo que le falta es tiempo. Contratar consume parte de ese mismo tiempo.<\/li>\n  <li>La automatización reemplaza las horas mecánicas, y el criterio sigue siendo suyo. Si contrata a alguien, conviene que sea para trabajo de mayor valor que descargar adjuntos y preparar formatos.<\/li>\n<\/ul>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Plazo del acuerdo<\/h4>\n<p>Los valores de esta sección corresponden a un acuerdo de 12 meses, que es el que le recomiendo por dos razones. La primera es que resulta más económico. La segunda es que un plazo definido me permite planear el soporte y las mejoras de su sistema en lugar de improvisarlos mes a mes.<\/p>\n<p>Si prefiere no comprometerse a 12 meses, el acuerdo mes a mes está disponible con un 25% adicional sobre la mensualidad y 30 días de preaviso de cualquiera de las dos partes. El mes a mes no se combina con la opción sin pago inicial.<\/p>\n<p>En ambos casos, al terminar el acuerdo sus documentos siguen en su Drive como están, y le entrego la configuración de su sistema (lista de clientes, reglas de clasificación y plantillas) con su documentación, para que otra persona no tenga que definir de nuevo los criterios. El sistema tendría que instalarse de nuevo; si prefiere que yo lo instale en cuentas a nombre suyo, esa instalación se cotiza aparte.<\/p>\n\n<div style=\"background:#E4EDE1;padding:22px 26px;margin:20px 0;break-inside:avoid;page-break-inside:avoid\">\n  <p style=\"margin:0 0 10px\">Tampoco le pido que se comprometa sin haber visto el sistema funcionando. Durante los primeros 30 días contados desde la puesta en operación, si el sistema no hace lo que esta propuesta describe, usted termina el acuerdo sin penalidad y sin discusión, cualquiera que sea la forma de pago y el plazo que haya elegido. Si pagó la implementación, le devuelvo el 50% pagado en la puesta en operación; si eligió la forma sin pago inicial, no queda con saldo pendiente.<\/p>\n  <p style=\"margin:0\">Los 30 días se cuentan desde la puesta en operación, para que correspondan a uso real del sistema. Así, el riesgo de que esto no funcione corre por mi cuenta.<\/p>\n<\/div>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Alternativa sin mensualidad<\/h4>\n<p><\/p>\n<p>Sin mensualidad, el sistema se instala en cuentas a nombre suyo y usted asume tres cosas:<\/p>\n<ul>\n  <li>Los costos de operar. Las cuentas se abren a nombre suyo y las paga usted directamente. En cuentas propias, sin compartir la plataforma, estimo ese costo entre $100.000 y $300.000 al mes, según el volumen.<\/li>\n  <li>Las fallas. El sistema se conecta con su correo y con su Drive, que son servicios de terceros y cambian sin aviso. Cuando algo falle, el sistema se detendrá hasta que alguien lo corrija, y cada corrección se cotizaría por separado.<\/li>\n  <li>La clasificación deja de mejorar. Se queda en la precisión del primer mes, porque el ciclo de correcciones es parte de lo que cubre la mensualidad.<\/li>\n<\/ul>\n<p>Si cuenta con alguien de sistemas que pueda hacerse cargo, es una alternativa perfectamente válida. Si no lo tiene, la mensualidad resulta menos costosa que una falla que pase inadvertida durante días.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec6 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 6<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Recomendación sobre por dónde empezar<\/h2>\n<p>La decisión es suya. Le doy mi recomendación y le indico también dónde mi propuesta no es la opción más conveniente para usted.<\/p>\n<p>Conviene seguir el orden de la cadena: el bloque 1 primero, después el checklist de documentos (2A) y, cuando tenga el dato de la sección 7, el de nómina (2B). Cada paso se apoya en el anterior, y si toma la 2A y la 2B juntas le descuento $500.000.<\/p>\n<p>Hoy usted paga personal para dos trabajos: la nómina y la exógena. La 2B cubre una parte del trabajo de nómina, que cada empleado esté y esté afiliado; la revisión de contratos y de cotizaciones sigue a cargo de quien la hace hoy.<\/p>\n<p>Para la exógena hay herramientas desde unos $120.000 que preparan los formatos. Están en el bloque 6, con los nombres y los precios.<\/p>\n<p>El bloque 1 merece una advertencia. Es lo primero que me mencionó y le consume tiempo con frecuencia, pero contratar a alguien por horas para descargar y archivar documentos cuesta poco. Hecha la cuenta, el bloque 1 por sí solo no representa un ahorro importante de dinero. Le ahorra interrupciones y una tarea que no le aporta nada, lo cual tiene valor.<\/p>\n<p>El ahorro aparece cuando al bloque 1 le sigue el 2, porque el checklist identifica lo que falta y le deja redactado el correo para solicitarlo.<\/p>\n\n<div style=\"background:#1F4622;color:#EDEFE8;padding:26px 30px;margin:22px 0;break-inside:avoid;page-break-inside:avoid\">\n  <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A6BC9F;margin-bottom:12px\">Recomendación principal<\/span>\n  <p style=\"margin:0 0 12px;font-family:'Playfair Display',Georgia,serif;font-size:24px;line-height:1.22;color:#F3F1E7;font-weight:700;letter-spacing:-.015em\">La 1A más la 2A, que juntas son $2.500.000 y $450.000 al mes.<\/p>\n  <p style=\"margin:0;font-size:15px;line-height:1.55;color:#C3D4BD\">Ahí tiene el ciclo completo: le llegan los documentos, quedan archivados, el sistema le indica qué falta de cada cliente y le deja redactado el correo para solicitarlo. El resto del documento puede revisarlo más adelante, cuando le resulte útil.<\/p>\n<\/div>\n\n<p>El bloque 3 depende de que me comparta la plantilla y del número de clientes. Si es uno solo, cargar el Excel en Claude cada período, con su propia suscripción (unos $80.000 al mes), le resulta mucho más económico que cualquier desarrollo a la medida.<\/p>\n<p>Y para poder decirle si la 2B le conviene de verdad, necesito el dato de la sección 7: cuánto le cuesta hoy la persona que contrata para eso.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Precio de este primer proyecto<\/h4>\n<p>Este es el primer proyecto que hago en revisoría fiscal y los valores lo reflejan, sobre todo en el bloque 1, que está por debajo de lo que me cuesta construirlo.<\/p>\n<p>Usted mencionó que lo que le funcione a usted podría servirle a otros colegas. Por eso me sirve más construir esto bien una vez, con alguien que conozca el oficio y me corrija, que cobrarle a usted el desarrollo completo.<\/p>\n<p>A cambio le pido una sola cosa: si el resultado le sirve, que me autorice a presentarlo como caso de referencia, sin nombrar a sus clientes ni mostrar su información, y sin nombrarla a usted salvo que lo autorice. La conversación sobre sus colegas la dejo para después de que esto esté funcionando y usted tenga resultados para evaluarlo.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec7 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 7<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Qué necesito de usted<\/h2>\n<p style=\"font-weight:700;color:#1F4622\">Antes de firmar (sin información de clientes)<\/p>\n<ol>\n  <li>(Bloque 1) Qué servicio de correo usa (Gmail personal, Google Workspace con dominio propio, Microsoft 365 u otro), porque de eso depende la forma de conectarlo, y si prefiere una dirección nueva, un alias o una regla de reenvío desde la que ya usa.<\/li>\n  <li>(Bloque 1) Saber si su carpeta de clientes está en una nube (Drive, OneDrive) o es una carpeta del computador que se sincroniza.<\/li>\n  <li>(Bloque 1) Las categorías de documentos con las que trabaja.<\/li>\n  <li>(Bloque 1) 2 o 3 sesiones para definir parámetros, similares a las que tendría con una persona nueva para explicarle qué debe revisar.<\/li>\n  <li>(Bloque 3) Cuántas entidades tiene hoy bajo revisoría fiscal.<\/li>\n  <li>(2B) Cuánto le cuesta la persona que contrata para la revisión de nómina, y por cuánto tiempo la contrata. Con ese dato puedo hacer la cuenta y decirle si la 2B le conviene.<\/li>\n  <li>(Bloque 4) Qué versión de Siigo usa su cliente (Nube, Contador Nube, Pyme o Ilimitada).<\/li>\n  <li>Una pregunta aparte: yo facturo desde Canadá. ¿Cómo le conviene que le facture, qué retenciones aplican y qué soporte necesita de mi lado? Se lo consulto porque es su campo, y así la facturación queda bien hecha desde el principio.<\/li>\n<\/ol>\n<p style=\"font-weight:700;color:#1F4622\">Después de firmar el acuerdo de tratamiento de datos<\/p>\n<ol>\n  <li>(Bloque 1) La lista de clientes y cómo están nombradas las carpetas.<\/li>\n  <li>(Bloque 2) Qué documentos espera de cada cliente en cada período. Es el insumo central del checklist y solo usted puede definirlo; para empezar basta con una lista aproximada de 2 o 3 clientes.<\/li>\n  <li>(2B) Sus parámetros de revisión de nómina, si toma la 2B.<\/li>\n  <li>(Bloque 3) La plantilla del informe y un ejemplo.<\/li>\n  <li>(Bloque 4) Los archivos de origen y una exportación del plan de cuentas y de los terceros de ese cliente.<\/li>\n  <li>(Bloque 5) Sus parámetros de revisión de impuestos y un mes real de un cliente, con las facturas y el Excel contra el que las cruza.<\/li>\n<\/ol>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec8 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 8<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Qué no incluye<\/h2>\n<ul>\n  <li>No reemplaza su software contable. Siigo y los sistemas de sus clientes se quedan como están. Lo que se automatiza es el trabajo alrededor de ellos.<\/li>\n  <li>No consulta bases de datos del gobierno. Todo trabaja sobre información que usted ya tiene.<\/li>\n  <li>No emite conclusiones, hallazgos ni dictamen.<\/li>\n  <li>Sus clientes no tienen que crear usuarios ni entrar a ningún sistema. Si toma la página de carga, esa página no tiene contraseña y usarla es opcional para cada cliente.<\/li>\n  <li>La 1A y la 1B no incluyen la lista de documentos que faltan de cada cliente; esa lista corresponde a la opción 2A.<\/li>\n  <li>No incluye licencias ni suscripciones de terceros que usted ya paga o decida contratar.<\/li>\n  <li>No incluye limpiar ni consolidar información. Los valores de implementación suponen que la información de origen llega en condiciones de usarse: archivos legibles, con los datos que cada proceso necesita y en los formatos incluidos en cada opción. Si al revisar sus materiales aparece trabajo previo, como completar o corregir NIT, unificar terceros escritos de forma distinta, consolidar archivos de varios períodos o adaptar formatos adicionales, se lo informo antes de empezar, con su costo. Si usted lo aprueba, ese valor se suma a la implementación y el plazo se ajusta. La estructura de carpetas que ya usa no hace falta ordenarla: el sistema se configura sobre ella.<\/li>\n  <li>La mensualidad cubre el costo de operación para un volumen de hasta 1.500 documentos al mes. Si su volumen real resulta bastante mayor, lo revisamos y se lo digo antes de que se vuelva un problema.<\/li>\n<\/ul>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec9 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 9<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Condiciones<\/h2>\n<ul>\n  <li>Forma de pago: el 50% de la implementación se paga antes de empezar el trabajo y el otro 50% en la puesta en operación. Para el bloque 1 puede elegir no hacer pago inicial, con compromiso de 12 meses, según lo explicado en el bloque 1; los demás bloques siguen esta misma forma de pago.<\/li>\n  <li>Mensualidad: empieza en la puesta en operación, es decir cuando termina el ajuste y el sistema queda funcionando con su información, y los 12 meses del acuerdo se cuentan desde esa fecha. El acuerdo es a 12 meses, o mes a mes con un 25% adicional, según lo explicado en la sección 5. Al cumplir los 12 meses, continúa con la misma mensualidad, salvo aviso de 30 días de cualquiera de las partes. En los dos casos aplica la cláusula de 30 días desde la puesta en operación, en los términos de la sección 5.<\/li>\n  <li>Sus documentos permanecen en su Drive. Al terminar el acuerdo le entrego la configuración y la documentación del sistema, según lo explicado en la sección 5.<\/li>\n  <li>Los plazos empiezan a contar cuando yo reciba el 50% inicial (salvo en la forma sin pago inicial), los accesos y los materiales de la sección 7, y suponen que usted pueda revisar cada avance dentro de la misma semana. Si toma varios bloques a la vez, los plazos no se suman completos porque parte del trabajo es compartido; le detallo el plazo total cuando me indique cuáles elige.<\/li>\n  <li>Información de origen: los valores de implementación suponen información en condiciones de usarse, según lo descrito en la sección 8. Cualquier trabajo de limpieza o consolidación se cotiza antes de hacerse y se suma a la implementación solo con su aprobación.<\/li>\n  <li>Impuestos: los valores están en pesos colombianos y no incluyen IVA ni retenciones, que se definen según la forma de facturación que acordemos (sección 7).<\/li>\n  <li>Vigencia: 30 días desde la fecha de esta propuesta.<\/li>\n<\/ul>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_sec10 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Sección 10<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Próximos pasos<\/h2>\n<ol>\n  <li>Me indica qué bloques le interesan y qué opción elige en cada uno; no es necesario decidirlos todos.<\/li>\n  <li>Me envía las respuestas de la sección 7 que no llevan información de clientes.<\/li>\n  <li>Si decide seguir, firmamos el acuerdo de tratamiento de datos, y solo después me envía información de sus clientes.<\/li>\n  <li>Paga el 50% de la implementación de los bloques que eligió, y con ese pago empieza el trabajo. Si toma la forma sin pago inicial, esto no aplica al bloque 1.<\/li>\n  <li>Tenemos 2 o 3 sesiones para definir categorías y parámetros, y empezamos la implementación.<\/li>\n<\/ol>\n<p>Quedo atento.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_f1 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Bloque 1<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Recepción y organización de documentos<\/h2>\n<p>Usted me pidió algo concreto: un asistente virtual que le avise cuántos correos llegaron y le deje descargados los archivos. La opción 1A corresponde a eso, y la
