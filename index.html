1B agrega una página de carga para sus clientes.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 1A: lo esencial<\/h4>\n<p>Cómo funcionaría, paso a paso:<\/p>\n<ol>\n  <li>Se crea una dirección para recibir documentos. Usted pone una regla en su correo que reenvíe ahí lo que le llega de clientes. Sus clientes siguen escribiéndole a usted y no tienen que cambiar nada; lo único nuevo que reciben es el acuse de recibo.<\/li>\n  <li>Cuando entra un correo, el sistema reconoce de qué cliente es por el remitente, usando la lista que usted me pase.<\/li>\n  <li>Guarda los adjuntos en la carpeta de ese cliente, en la nube donde usted ya tiene sus carpetas.<\/li>\n  <li>En ese mismo momento le envía al cliente el acuse de recibo automático, con el texto que usted apruebe.<\/li>\n  <li>Al final del día le llega un solo correo con lo que entró: de qué clientes, cuántos archivos y en qué carpeta quedaron.<\/li>\n  <li>Si llega un correo de un remitente que el sistema no reconoce, queda en una carpeta de pendientes y aparece señalado en el resumen para que usted lo ubique.<\/li>\n<\/ol>\n\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $1.000.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Mensualidad<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">COP $300.000<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;column-gap:34px;margin:22px 0 6px;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"border-top:3px solid #1F4622;padding-top:11px\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#1F4622;margin-bottom:8px\">A favor<\/span>\n    <p style=\"margin:0;font-size:15px;line-height:1.5;color:#2A251C\">es lo que usted pidió, se implementa en poco tiempo y usted lo ve funcionando el primer mes. Sus clientes siguen enviándole los documentos como hoy.<\/p>\n  <\/div>\n  <div style=\"border-top:3px solid #CF6B3F;padding-top:11px\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">En contra<\/span>\n    <p style=\"margin:0;font-size:15px;line-height:1.5;color:#2A251C\">archiva por cliente, no por tipo de documento. Dentro de la carpeta usted sigue viendo los archivos como se los enviaron. Es la misma organización que usted hace hoy a mano, sin que tenga que hacerla.<\/p>\n  <\/div>\n<\/div>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 1B: con página de carga para sus clientes<\/h4>\n<p>Todo lo de la 1A, y además una página con su logo donde cada cliente tiene su propio enlace y arrastra los archivos en vez de escribirle.<\/p>\n<ul>\n  <li>Sin usuario y sin contraseña. El enlace ya sabe qué empresa es.<\/li>\n  <li>Con el correo, el cliente se deduce del remitente, y esa deducción falla cuando alguien escribe desde otra cuenta o envía documentos de dos empresas en el mismo mensaje. En la página, el enlace identifica al cliente y la asignación no depende del remitente.<\/li>\n  <li>Los archivos no pasan por ninguna bandeja de correo: van cifrados directo a su Drive. Esto puede dar tranquilidad a los clientes que se preocupan por el manejo de su información.<\/li>\n  <li>El correo sigue funcionando igual en paralelo, para quien no la use. Nadie queda por fuera.<\/li>\n<\/ul>\n\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $1.500.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Mensualidad<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">COP $450.000<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">3 semanas<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">2 semanas más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;column-gap:34px;margin:22px 0 6px;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"border-top:3px solid #1F4622;padding-top:11px\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#1F4622;margin-bottom:8px\">A favor<\/span>\n    <p style=\"margin:0;font-size:15px;line-height:1.5;color:#2A251C\">sus clientes encuentran una página con la marca de usted, y la identificación de cada documento ya no depende de la cuenta desde la que le escriban. Es además la base del dashboard del bloque 3, si más adelante lo quiere.<\/p>\n  <\/div>\n  <div style=\"border-top:3px solid #CF6B3F;padding-top:11px\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">En contra<\/span>\n    <p style=\"margin:0;font-size:15px;line-height:1.5;color:#2A251C\">sirve en la medida en que sus clientes la usen, y eso no depende ni de usted ni de mí. Con los que no la adopten, el correo sigue haciendo su trabajo.<\/p>\n  <\/div>\n<\/div>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Adiciones posibles más adelante<\/h4>\n<p>Dos cosas menores que no incluyo en ningún precio porque usted no las pidió:<\/p>\n<ul>\n  <li>Que el sistema lea el XML de la factura electrónica para sacar los datos exactos en vez de leerlos del PDF.<\/li>\n  <li>Un panel con buscador para consultar todo lo recibido sin entrar a las carpetas.<\/li>\n<\/ul>\n<p>Son unos $800.000 por las dos. Conviene evaluarlas después de unos meses de uso, cuando tenga claro si las necesita.<\/p>\n\n<div style=\"margin:14px 0 20px;break-inside:avoid;page-break-inside:avoid\">\n  <sc-raw-table>\n    <sc-raw-caption style=\"caption-side:top;text-align:left;padding:0 0 10px\">\n      <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:17.5px;font-weight:700;color:#16331A;letter-spacing:-.014em;line-height:1.2\">Comparación de las dos opciones del bloque 1<\/span>\n    <\/sc-raw-caption>\n    <sc-raw-thead><sc-raw-tr><sc-raw-th><\/sc-raw-th><sc-raw-th style=\"width:110px;text-align:center\">1A esencial<\/sc-raw-th><sc-raw-th style=\"width:110px;text-align:center\">1B con página<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td>Archiva en su Drive, en la carpeta de cada cliente<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>Acuse de recibo automático al cliente, en el momento<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Resumen diario de lo que entró<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>Página con la marca de usted donde el cliente deja los archivos<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#6A6252\">no<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Sabe de qué cliente es sin deducirlo del remitente<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#6A6252\">no<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>Los documentos no pasan por una bandeja de correo<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#6A6252\">no<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Habilita el dashboard del bloque 3<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#6A6252\">no<\/sc-raw-td><sc-raw-td style=\"text-align:center;color:#1F4622;font-weight:600\">sí<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td>Implementación<\/sc-raw-td><sc-raw-td style=\"text-align:center\"><strong>$1.000.000<\/strong><\/sc-raw-td><sc-raw-td style=\"text-align:center\"><strong>$1.500.000<\/strong><\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Mensualidad<\/sc-raw-td><sc-raw-td style=\"text-align:center\"><strong>$300.000<\/strong><\/sc-raw-td><sc-raw-td style=\"text-align:center\"><strong>$450.000<\/strong><\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td><strong>O sin pago inicial<\/strong> (12 meses)<\/sc-raw-td><sc-raw-td style=\"text-align:center\"><strong>$420.000/mes<\/strong><\/sc-raw-td><sc-raw-td style=\"text-align:center\"><strong>$630.000/mes<\/strong><\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Listo en<\/sc-raw-td><sc-raw-td style=\"text-align:center\">1 semana + 1<\/sc-raw-td><sc-raw-td style=\"text-align:center\">3 semanas + 2<\/sc-raw-td><\/sc-raw-tr>\n    <\/sc-raw-tbody>\n  <\/sc-raw-table>\n<\/div>\n\n<p>La diferencia entre las dos es de $500.000 en la implementación y $150.000 en la mensualidad. Por esa diferencia, sus clientes tienen una página con la marca de usted donde dejar sus documentos. Si el presupuesto lo permite y quiere la página desde el comienzo, la 1B es la opción más completa.<\/p>\n<p>Si prefiere avanzar con cautela, le sugiero empezar por la 1A. En un mes sabría si esto le sirve, con una inversión menor, y la 1B se puede agregar después, cuando tenga claro qué le hace falta.<\/p>\n<p>Forma de pago sin pago inicial. Un desembolso inicial tiene un efecto distinto del de una mensualidad, sobre todo cuando la alternativa es contratar a alguien, que no cobra nada por adelantado. Con esta forma de pago usted no paga la implementación del bloque 1 al comenzar; a cambio, la mensualidad sube $120.000 con la 1A o $180.000 con la 1B durante 12 meses, con compromiso de 12 meses, porque yo financio la implementación. Al cabo del primer año cuesta $440.000 más con la 1A, o $660.000 más con la 1B. Pasados los 12 meses queda en la mensualidad normal de la sección 5.<\/p>\n<p>Si su flujo de caja lo permite, el pago de 50% antes de empezar y 50% en la puesta en operación resulta más económico.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_f2 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Bloque 2<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Revisión contra checklist<\/h2>\n<p>Este es el paso 2 de la cadena: además de archivar, el sistema revisa.<\/p>\n<p>La mecánica es siempre la misma: se define qué debería estar, el sistema compara contra lo que hay, y lo que falta o no cuadra sale marcado. Es exactamente lo que usted le explica a alguien cuando lo contrata para revisar algo.<\/p>\n<p>Cambia el material sobre el que trabaja, y por eso hay dos aplicaciones. No son excluyentes: puede tomar una, la otra, o las dos.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 2A: checklist de documentos de clientes<\/h4>\n<p>Cómo funcionaría:<\/p>\n<ol>\n  <li>El sistema reconoce qué es cada archivo que entró por el bloque 1: factura, extracto bancario, certificado de retención, nómina, o las categorías que usted defina.<\/li>\n  <li>Usted llena un Excel con los documentos que espera de cada cliente en cada período. No incluyo una pantalla para eso, porque usted ya trabaja en Excel y probablemente le resulte más rápido mantener la lista ahí. El sistema lo lee.<\/li>\n  <li>A medida que llegan, los va marcando contra esa lista.<\/li>\n  <li>Usted recibe un reporte por cliente: qué está completo y qué falta.<\/li>\n  <li>Para lo que falta, el sistema le prepara el borrador del correo de seguimiento al cliente: recibimos esto y esto, nos hace falta aquello. Usted lo revisa y lo envía, o permite que se envíe automáticamente en la fecha que defina. Mientras la clasificación se ajusta, le recomiendo revisar cada borrador, porque un documento mal reconocido podría aparecer como faltante.<\/li>\n<\/ol>\n\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $1.500.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Mensualidad<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">+ COP $150.000<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Requiere<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">el bloque 1<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 a 2 semanas más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<p>Esta opción usa buena parte de las piezas del bloque 1: la recepción, el almacenamiento, la base de datos y el envío de correos. Lo propio de la 2A es reconocer el tipo de documento, leer su Excel de documentos esperados, comparar y enviar dos correos más. Como ese trabajo compartido se hace una sola vez, el precio lo refleja.<\/p>\n<p><\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 2B: checklist de nómina y seguridad social<\/h4>\n<p>El mismo mecanismo, aplicado a empleados en vez de a documentos. Cubre una parte de lo que hoy revisa la persona que contrata: que cada empleado esté y esté afiliado. No revisa contratos ni cotizaciones (ver “Alcance excluido de la 2B”).<\/p>\n<p>Cómo funcionaría:<\/p>\n<ol>\n  <li>Usted guarda la lista de empleados y el soporte de afiliaciones de ese cliente en su carpeta dentro de su Drive, o su cliente comparte con el sistema la carpeta de nómina; en ese caso el sistema solo ve lo compartido.<\/li>\n  <li>Definimos el checklist: qué tiene que estar, para cada empleado.<\/li>\n  <li>El sistema recorre empleado por empleado y verifica que esté y que esté afiliado.<\/li>\n  <li>Le entrega la lista de faltantes: quién no aparece, a quién le falta qué, y dónde miró el sistema para decirlo.<\/li>\n  <li>Usted revisa y concluye.<\/li>\n<\/ol>\n\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $2.000.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Alcance<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">hasta 3 formatos de nómina distintos<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Mensualidad<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">ninguna, ver abajo<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">2 semanas<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<p>Como la información está en archivos que usted o su cliente comparten y no hay que consultar bases de datos del gobierno, esto es viable.<\/p>\n<p>La 2B comparte con la 2A el marco del checklist y los reportes, pero el grueso de esta opción es trabajo propio: leer nóminas de clientes en formatos distintos y cruzar a cada persona entre dos fuentes, lo que exige conciliar identidades. Es alrededor de un 60% más de trabajo que la 2A, y por eso cuesta más.<\/p>\n<p>El riesgo propio de esta opción es que un empleado que no cruce bien entre las dos fuentes puede aparecer como faltante sin estarlo. Esos casos se corrigen, y se lo advierto desde ahora para que no los encuentre por sorpresa en un reporte.<\/p>\n<p>El tope de 3 formatos tiene una razón. Lo que mueve el costo aquí no es cuántos empleados sino cuántas formas distintas de llevar la nómina tenga que leer el sistema. Con 2 o 3 clientes que la lleven parecido, esto es rápido. Con quince que la lleven cada uno a su manera, es otro proyecto. Si aparecen más formatos después, los cotizamos aparte, y se lo digo antes de empezar a tradescargarlos.<\/p>\n<p>Esta opción no lleva mensualidad, por las razones de la sección 5. El precio incluye 6 meses de soporte y, después, un mantenimiento anual opcional de $500.000; si no lo toma, cualquier corrección se cotiza en el momento.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Descuento por tomar las dos opciones<\/h4>\n<p>El trabajo de sentarnos a definir criterios se hace una sola vez y le sirve a las dos. Si las toma juntas, le descuento $500.000 del total.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Alcance excluido de la 2B<\/h4>\n<p>La 2B verifica que la gente esté y esté afiliada. No cruza cuánto está cotizando cada quien contra su tipo de contrato y su salario. Eso se puede hacer y cuesta entre $2.000.000 y $3.000.000 más, pero lo dejo aparte porque las reglas de liquidación tienen excepciones con criterios propios, como el salario integral, las personas que cotizan por varios empleadores, las incapacidades y las licencias. Incluirlas todas desde el inicio multiplica el trabajo y multiplica también la posibilidad de que el sistema le diga que algo está bien cuando no lo está. En esta opción, ese error llega hasta su dictamen, y el dictamen lo firma usted.<\/p>\n<p>Prefiero cubrir menos y acertar. Si después de usar la 2B quiere el cruce de cotizaciones, lo hablamos con datos suyos en la mano.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_f3 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Bloque 3<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Informes y dashboard<\/h2>\n<p>Según entendí, usted trabaja con una plantilla de informe en Excel cuya estructura no cambia entre períodos, y eso es lo que permite automatizarla. Para cotizarlo en firme necesito verla.<\/p>\n<p>La gerente de su cliente preparó ese dashboard subiendo un Excel a Claude, y usted podría hacer lo mismo con su propia suscripción (unos $80.000 al mes). Para un solo cliente, hacerlo así cada período le resulta mucho más económico que contratarme. Automatizarlo le ahorra subir el archivo, escribir la instrucción, copiar el resultado, llenar la plantilla y acordarse cada período.<\/p>\n<p>La pregunta que decide si vale la pena es cuántos clientes. Si es uno, le recomiendo seguir con Claude. Si esto se repite para 5, 10 o 15 entidades, el ahorro se multiplica por esa cantidad y ahí la inversión se justifica. Si me indica cuántos son, le digo si le conviene.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 3A: llenado de la plantilla<\/h4>\n<p>Cómo funcionaría:<\/p>\n<ol>\n  <li>Nos sentamos una vez sobre su plantilla y definimos de dónde sale cada cifra: esta celda viene de esta cuenta, esta otra de este reporte.<\/li>\n  <li>Cuando llega el reporte del período, el sistema lo lee y saca esos valores.<\/li>\n  <li>Le deja la plantilla llena, igual a como usted la tiene hoy, guardada en su Drive, y le avisa que ya está.<\/li>\n  <li>Junto a ella le deja una hoja de trazabilidad: cada cifra con el dato de dónde salió, para que pueda verificarla sin rehacer el trabajo.<\/li>\n  <li>Usted revisa y la sube como hace hoy.<\/li>\n<\/ol>\n\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $800.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 3B: llenado y dashboard en la página de carga<\/h4>\n<p>Lo mismo de la 3A, y además el dashboard queda publicado en la misma página de carga, como una sección más.<\/p>\n<p>Cómo se ve en la práctica:<\/p>\n<ol>\n  <li>El cliente entra a su enlace, el mismo por donde le sube los documentos.<\/li>\n  <li>Ahí mismo, en otra pestaña, consulta el dashboard de su empresa con las cifras del período, después de que usted las revisa, sin tener que solicitárselo.<\/li>\n  <li>Cada cliente ve solamente lo de su empresa. Para abrir las cifras, además del enlace, se pide un código que llega al correo registrado del cliente.<\/li>\n  <li>Usted no tiene que subir ni enviar el informe, y sus clientes pueden consultarlo sin escribirle para preguntar si está listo.<\/li>\n<\/ol>\n<p>Incluye revisar la plantilla con usted antes de automatizarla, por si conviene ajustarla ahora que la vamos a dejar fija.<\/p>\n\n<div style=\"background:#F2E6D6;padding:15px 22px 16px;margin:15px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $1.200.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Requiere<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">la opción 1B del bloque 1, por la página de carga<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">2 semanas<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 a 2 semanas más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<p>La dependencia de la 1B y el precio tienen la misma explicación. Lo que hace posible que cada cliente vea solo lo suyo es el sistema de enlaces por empresa que va con la página de carga de la opción 1B. Apoyado en él, publicar el dashboard sale bastante más barato que montar un canal de publicación aparte, y por eso el precio es este. Si se queda en la 1A, el dashboard también se puede hacer, pero lo vería solamente usted y tendría que enviárselo a su cliente.<\/p>\n<p>Un efecto que vale la pena considerar: un cliente que entra a un enlace con el logo de usted, sube sus documentos y consulta sus cifras al día percibe de otra manera el servicio que recibe.<\/p>\n<p>Para cotizar cualquiera de las dos en firme necesito la plantilla que usa y un informe de ejemplo, que puede compartirme una vez firmado el acuerdo de tratamiento de datos.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_f4 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Bloque 4<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Archivo para cargar a Siigo<\/h2>\n<p>Su cliente seguirá trabajando en Siigo. Lo que se automatiza es el paso anterior: reunir los archivos que llegan y dejarlos en el formato de importación.<\/p>\n<p>Este bloque no lleva mensualidad, por las razones de la sección 5. El precio incluye 6 meses de soporte. Después puede tomar un mantenimiento anual opcional de $500.000 para que yo atienda los cambios de formato que aparezcan; si no lo toma, cualquier corrección se cotiza en el momento.<\/p>\n<p>En la llamada le dije que no sabía si Siigo acepta subir la información desde un archivo, y ya lo verifiqué. Según sus propios manuales para Siigo Nube, Siigo Contador Nube, Siigo Pyme y Siigo Ilimitada, se pueden importar comprobantes contables desde un archivo, y el formato de importación cambia según la versión. Falta confirmar que el plan de su cliente incluya esa función, y se lo confirmo antes de que pague este bloque.<\/p>\n<p>Tres cosas que aprendí revisando y que conviene que sepa:<\/p>\n<ul>\n  <li>La plantilla cambia según cuál Siigo use su cliente. No es la misma en Nube que en la versión de escritorio. Por eso necesito saber cuál usa antes de arrancar.<\/li>\n  <li>Siigo Nube acepta hasta 500 registros por archivo. Si un mes supera ese número, el sistema divide el resultado en varios archivos.<\/li>\n  <li>Las cuentas y los terceros tienen que existir antes en Siigo, porque el cargue no los crea. Si aparece una cuenta o un tercero que no existe, el sistema se lo indica antes de subir el archivo.<\/li>\n<\/ul>\n<p>Esto tiene más valor del que parece: Siigo no documenta una forma de deshacer un cargue, y corregir un archivo subido con errores puede exigir arreglar comprobante por comprobante. Por eso el paso de validación que le describo abajo es la protección principal contra el problema más costoso de este bloque.<\/p>\n<p>Existe además una alternativa: Siigo publica una conexión directa (API), sin archivos de por medio, que evitaría el límite de 500 registros. Depende de que su cliente dé permisos en su cuenta de Siigo, y no todos los planes la incluyen. Si le interesa esa vía, la exploramos; el archivo funciona sin pedir permisos adicionales.<\/p>\n<p>Los valores suponen además que tome el bloque 1, porque comparte con él la parte de recibir y leer archivos.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 4A: un cliente<\/h4>\n<p>Cómo funcionaría:<\/p>\n<ol>\n  <li>Miramos el formato exacto que Siigo importa para ese cliente y de dónde sale cada columna.<\/li>\n  <li>El sistema toma los archivos que llegan de hasta 3 formatos de origen y los lee.<\/li>\n  <li>Genera un solo archivo, en el formato que Siigo espera, listo para subir.<\/li>\n  <li>Lo valida antes de entregárselo: filas incompletas, cuentas o terceros que no existen y totales que no cuadran contra el origen. Esas diferencias se reportan aparte, para corregirlas antes de subir el archivo.<\/li>\n  <li>Usted o su auxiliar lo sube, sin digitar la información comprobante por comprobante.<\/li>\n<\/ol>\n\n<div style=\"background:#F2E6D6;padding:12px 22px 13px;margin:11px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $1.500.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Alcance<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">un cliente, hasta 3 formatos de origen<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 semana más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<p>El tope de 3 formatos de origen tiene una razón: el trabajo depende de cuántas fuentes distintas envían la información y en qué forma, más que del cliente. Con 2 o 3 formatos esto es rápido; con 7, es otro proyecto. Cuando me indique con qué cliente empezamos, le confirmo que cabe en ese alcance.<\/p>\n\n<h4 style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid #E2DACB;max-width:none;break-after:avoid;page-break-after:avoid\">Opción 4B: hasta cinco clientes<\/h4>\n<p>Lo mismo, para varios clientes a la vez. Cada uno tiene su propio plan de cuentas y sus propios orígenes, así que cada cliente que se suma lleva su propio mapeo.<\/p>\n\n<div style=\"background:#F2E6D6;padding:12px 22px 13px;margin:11px 0;display:flex;gap:26px;align-items:flex-start;max-width:none;print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid\">\n  <div style=\"flex:none;min-width:170px;border-right:1px solid rgba(31,70,34,.18);padding-right:26px\">\n    <span style=\"display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A8482A;margin-bottom:8px\">Implementación<\/span>\n    <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:800;color:#1F4622;line-height:1;letter-spacing:-.03em\">COP $3.000.000<\/span>\n  <\/div>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Alcance<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">hasta 5 clientes, cada uno con hasta 3 formatos de origen<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Cliente adicional después del quinto<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">+ COP $600.000 cada uno<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0;border-bottom:1px solid rgba(31,70,34,.13)\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Primera versión funcionando<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">3 semanas<\/span><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:5px 0\"><span style=\"font-size:13.5px;color:#6A6252;max-width:none;line-height:1.35\">Ajuste<\/span><span style=\"font-size:14px;font-weight:600;color:#16331A;text-align:right;line-height:1.35\">1 a 2 semanas más<\/span><\/div>\n  <\/div>\n<\/div>\n\n<p>Este valor es menor de lo que podría esperarse porque agregar un cliente se configura en una hoja de Excel, igual que la lista de documentos esperados, y el sistema la lee. Eso reduce el costo de cada cliente adicional lo suficiente para que 5 clientes cuesten lo mismo que 2 cotizados por separado.<\/p>\n<p>Le pongo el número de clientes en el alcance porque cada cliente agrega su propio plan de cuentas y sus formatos, y así queda claro qué estamos acordando.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_f5 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Bloque 5<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Revisión de impuestos contra soportes<\/h2>\n<p>Esto lo mencionó usted durante la reunión y no se lo cotizo todavía, pero quiero dejarlo escrito para que sepa que lo oí.<\/p>\n<p>Lo que entendí: cruzar las facturas contra el Excel, verificando que las retenciones estén y que cumplan los parámetros que usted defina. Es la misma mecánica del bloque 2: el sistema compara, marca lo que no cuadra, y usted concluye.<\/p>\n<p>Todavía no le pongo precio, por dos razones.<\/p>\n<p>La primera es que los parámetros son la parte que aún no conozco, y ahí está todo el trabajo. Cotizarle sin verlos sería inventar un número.<\/p>\n<p>La segunda es que este es el bloque donde equivocarse cuesta más caro. Una retención que el sistema dé por buena cuando no lo está es un hallazgo que se le pasó, y lo firma usted. Antes de proponerle algo así quiero entender bien qué margen de error es aceptable para usted y dónde tiene que parar la máquina y empezar su criterio.<\/p>\n<p>Si le interesa, una vez firmado el acuerdo de tratamiento de datos puede enviarme sus parámetros y un mes real de un cliente, y se lo cotizo con el mismo criterio que el resto. Si al revisarlo considero que el riesgo no compensa, también se lo diré.<\/p>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ show_f6 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:rise .3s ease both\">\n    <span style=\"display:block;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#A8482A;margin-bottom:14px\">Bloque 6<\/span>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.06;letter-spacing:-.028em;color:#1F4622;margin:0 0 26px;max-width:none;text-wrap:balance\">Información exógena<\/h2>\n<p style=\"margin:0 0 9px\">En la reunión usted mencionó que ha visto a otros contadores usar aplicativos para esto, aunque no los había revisado. Los revisé: varios preparan los formatos a partir del balance de prueba por terceros y cuestan una fracción de lo que yo le cobraría por desarrollarlo.<\/p>\n<p style=\"margin:0 0 9px\">Un punto a favor de contratar algo a la medida: el prevalidador gratuito de la DIAN solamente valida y convierte a XML un archivo que usted ya preparó con la estructura exacta. No lo construye a partir de su contabilidad. Ese trabajo previo alguien lo tiene que hacer.<\/p>\n<p style=\"margin:0 0 9px\">Y el punto en contra, que pesa más: ese trabajo previo ya lo resuelven varias herramientas colombianas. A diferencia de los módulos de exógena de Siigo, Alegra o Helisa, estas no exigen que la contabilidad se lleve en su propio sistema y toman un balance de prueba por terceros exportado de cualquier programa, lo que se ajusta a su caso porque trabaja con clientes en sistemas distintos.<\/p>\n\n<div style=\"margin:10px 0;break-inside:avoid;page-break-inside:avoid\">\n  <sc-raw-table>\n    <sc-raw-caption style=\"caption-side:top;text-align:left;padding:0 0 7px\">\n      <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:17.5px;font-weight:700;color:#16331A;letter-spacing:-.014em;line-height:1.2\">Herramientas de exógena disponibles hoy en el mercado<\/span>\n    <\/sc-raw-caption>\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:170px;padding:6px 12px\">Herramienta<\/sc-raw-th><sc-raw-th style=\"width:190px;padding:6px 12px\">Precio<\/sc-raw-th><sc-raw-th style=\"padding:6px 12px\">Nota<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 12px\">exceltributario.com<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\"><strong>COP $120.000<\/strong> + IVA, pago único<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\">13 formatos. Agrupa solo en cuantías menores lo que viene sin identificar<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td style=\"padding:6px 12px\">Actualícese Exógena<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\"><strong>COP $119.900<\/strong>, pago único<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\">Copia directo del reporte de cualquier software contable<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 12px\">Ofiscol<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\"><strong>COP $149.900<\/strong> + IVA, pago único<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\">Importa balance de prueba por terceros en Excel<\/sc-raw-td><\/sc-raw-tr>\n      <sc-raw-tr style=\"background:#F3F1E7\"><sc-raw-td style=\"padding:6px 12px\">Exógena Pro<\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\"><strong>COP $199.000 a $1.690.000 al año<\/strong><\/sc-raw-td><sc-raw-td style=\"padding:6px 12px\">Por número de empresas. La de $1.690.000 cubre hasta 50 empresas y 10 usuarios<\/sc-raw-td><\/sc-raw-tr>\n    <\/sc-raw-tbody>\n  <\/sc-raw-table>\n  <p style=\"margin:6px 0 0;font-size:13px;color:#6A6252;line-height:1.45\">Precios consultados en septiembre de 2026 en las páginas de cada proveedor. Verifíquelos antes de comprar, porque pueden cambiar, y confirme cuántas empresas y qué año gravable cubre cada licencia.<\/p>\n<\/div>\n\n<p style=\"margin:0 0 9px\">Le recomiendo probar una de las opciones económicas antes de considerar un desarrollo a la medida. Por unos $120.000 resuelve la duda. Si le sirve, usted evita pagar un desarrollo y yo evito venderle algo que no necesita.<\/p>\n<p style=\"margin:0 0 9px\">Queda un posible problema. Ninguna de estas herramientas reconstruye NITs faltantes o equivocados, ni concilia terceros que aparecen escritos distinto en los sistemas de clientes diferentes. Eso sigue siendo limpieza manual. Si después de probar una herramienta resulta que ahí es donde se concentra su tiempo, hablamos y le cotizo esa pieza puntual, que es mucho más pequeña y más económica que construir un generador completo.<\/p>\n  <\/div>\n<\/sc-if>\n\n        <div style=\"margin-top:44px;padding-top:24px;border-top:2px solid #1F4622\">\n          <p style=\"max-width:none\">Me indica qué bloques le interesan cuando lo tenga claro. No es necesario decidirlos todos, y el precio del bloque 3 queda en firme cuando revise su plantilla.<\/p>\n          <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;color:#1F4622;letter-spacing:-.015em;margin-top:16px\">Camilo Camacho Escamilla<\/span>\n          <span style=\"display:block;font-size:14.5px;color:#6A6252;margin-top:5px\">Dantia · <a href=\"mailto:hola@dantia.ca\">hola@dantia.ca<\/a><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180}}\">\nclass Component extends DCLogic {\n  state = {\n    stage: 0,\n    step: 0,\n    sel: 'sec-1',\n    b1: '1A', b2a: false, b2b: false, b3: 'none', b4: 'none',\n    plazo: '12', sinPago: false\n  };\n\n  cop(n) { return 'COP $' + n.toLocaleString('es-CO').replace(/,/g, '.'); }\n  plain(n) { return '$' + n.toLocaleString('es-CO').replace(/,/g, '.'); }\n\n  // Single source of truth for scope -> mensualidad. `base` is bloque 1's\n  // contribution, which differs between the sin-pago year and afterwards;\n  // every other add-on and the cap are identical, so they live here once.\n  // What the scope costs to build, before the sin-pago deferral. The cap\n  // is a share of THIS, so it has to count bloque 1 even when that bloque\n  // is being financed rather than paid up front.\n  grossImpl() {\n    const s = this.state;\n    let n = s.b1 === '1B' ? 1500000 : 1000000;\n    if (s.b2a) n += 1500000;\n    if (s.b2b) n += 2000000;\n    if (s.b2a && s.b2b) n -= 500000;\n    if (s.b3 === '3A') n += 800000;\n    if (s.b3 === '3B') n += 1200000;\n    if (s.b4 === '4A') n += 1500000;\n    if (s.b4 === '4B') n += 3000000;\n    return n;\n  }\n\n  scopeBase() {\n    const s = this.state;\n    let m = s.b1 === '1B' ? 450000 : 300000;\n    if (s.b2a) m += 150000;\n    if (s.b3 !== 'none') m += 300000;\n    return m;\n  }\n\n  // The sin-pago premium finances the build, so it rides on top of the\n  // operating fee rather than being folded into it.\n  monthly(sinPago) {\n    const s = this.state;\n    let m = this.scopeBase();\n    if (sinPago) m += s.b1 === '1B' ? 180000 : 120000;\n    return m;\n  }\n\n  figures() {\n    const s = this.state;\n    const b1impl = s.b1 === '1B' ? 1500000 : 1000000;\n    const impl = this.grossImpl() - (s.sinPago ? b1impl : 0);\n\n    let mes = this.monthly(s.sinPago);\n    if (s.plazo === 'mes') mes = Math.round(mes * 1.25);\n\n    return { impl, mes, deferred: s.sinPago ? (s.b1 === '1B' ? 1500000 : 1000000) : 0 };\n  }\n\n  set(patch) { this.setState(patch); }\n\n  go(stage) {\n    this.setState({ stage });\n    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  toStep(n) {\n    this.setState({ step: n });\n    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  open(id) {\n    this.setState({ sel: id, stage: 5 });\n    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const f = this.figures();\n    // After twelve months a sin-pago acuerdo reverts to the normal\n    // mensualidad for the SAME scope, not for bloque 1 alone.\n    const after = (s.sinPago ? this.monthly(false) : f.mes) * 12;\n\n    const v = {\n      isCover: s.stage === 0,\n      isGracias: s.stage === 1,\n      isProblema: s.stage === 2,\n      isPrecio: s.stage === 3,\n      isPuente: s.stage === 4,\n      isDetalle: s.stage === 5,\n      showRail: s.stage > 0,\n\n      next: () => this.go(s.stage + 1),\n      step0: s.step === 0, step1: s.step === 1, step2: s.step === 2,\n      step3: s.step === 3, step4: s.step === 4, step5: s.step === 5,\n      dot0: s.step === 0 ? '#1F4622' : '#D8D0BE',\n      dot1: s.step === 1 ? '#1F4622' : '#D8D0BE',\n      dot2: s.step === 2 ? '#1F4622' : '#D8D0BE',\n      dot3: s.step === 3 ? '#1F4622' : '#D8D0BE',\n      dot4: s.step === 4 ? '#1F4622' : '#D8D0BE',\n      dot5: s.step === 5 ? '#1F4622' : '#D8D0BE',\n      toStep0: () => this.toStep(0), toStep1: () => this.toStep(1),\n      toStep2: () => this.toStep(2), toStep3: () => this.toStep(3),\n      toStep4: () => this.toStep(4), toStep5: () => this.toStep(5),\n      stepBackLabel: s.step === 0 ? '← El problema y el camino' : '← Bloque anterior',\n      stepNextLabel: s.step === 5 ? 'Ver la propuesta en detalle'\n        : s.step === 4 ? 'Ver su selección' : 'Siguiente bloque',\n      stepBack: () => (s.step === 0 ? this.go(2) : this.toStep(s.step - 1)),\n      stepNext: () => (s.step === 5 ? this.go(4) : this.toStep(s.step + 1)),\n      goBack: () => this.go(Math.max(0, s.stage - 1)),\n      restart: () => this.go(0),\n      goDetalle: () => this.go(5),\n      goPrecio: () => this.go(3),\n\n      is1A: s.b1 === '1A', is1B: s.b1 === '1B',\n      not1A: s.b1 !== '1A', not1B: s.b1 !== '1B',\n      has2A: s.b2a, has2B: s.b2b, bothTwo: s.b2a && s.b2b,\n      no2A: !s.b2a, no2B: !s.b2b,\n      is3A: s.b3 === '3A', is3B: s.b3 === '3B',\n      no3A: s.b3 !== '3A', no3B: s.b3 !== '3B',\n      no4A: s.b4 !== '4A', no4B: s.b4 !== '4B',\n      need1B: s.b3 === '3B' && s.b1 !== '1B',\n      is4A: s.b4 === '4A', is4B: s.b4 === '4B',\n      is12: s.plazo === '12', isMes: s.plazo === 'mes',\n      sinPago: s.sinPago,\n\n      totalImpl: f.impl === 0 ? 'Sin pago inicial' : this.plain(f.impl),\n      totalMes: this.plain(f.mes),\n      hasDeferred: f.deferred > 0,\n      notaDeferred: 'No incluye el bloque 1 (' + this.plain(f.deferred) +\n        '), que no se paga al inicio y queda financiado en la mensualidad durante 12 meses.',\n      primerAno: this.plain(f.impl + f.mes * 12),\n      anoSiguiente: this.plain(after),\n      // 2B and bloque 4 carry an optional annual maintenance instead of a\n      // mensualidad, so the años-siguientes figure excludes it.\n      hasMaint: s.b2b || s.b4 !== 'none',\n      notaMaint: 'Sin el mantenimiento anual opcional de la 2B y el bloque 4 ($500.000 cada uno).',\n      notaTope: 'La mensualidad es la suma de los bloques con mensualidad que tenga en operación; la 2B y el bloque 4 no la cambian.' +\n        (s.sinPago ? ' Incluye ' + this.plain(s.b1 === '1B' ? 180000 : 120000) + ' al mes por la financiación del bloque 1 durante 12 meses.' : '') +\n        (s.plazo === 'mes' ? ' Incluye el 25% del acuerdo mes a mes.' : ''),\n\n      pick1A: () => this.set({ b1: '1A', b3: s.b3 === '3B' ? 'none' : s.b3 }),\n      pick1B: () => this.set({ b1: '1B' }),\n      tog2A: () => this.set({ b2a: !s.b2a }),\n      tog2B: () => this.set({ b2b: !s.b2b }),\n      pick3A: () => this.set({ b3: s.b3 === '3A' ? 'none' : '3A' }),\n      pick3B: () => (s.b3 === '3B'\n        ? this.set({ b3: 'none' })\n        : this.set({ b3: '3B', b1: '1B' })),\n      pick4A: () => this.set({ b4: s.b4 === '4A' ? 'none' : '4A' }),\n      pick4B: () => this.set({ b4: s.b4 === '4B' ? 'none' : '4B' }),\n      plazo12: () => this.set({ plazo: '12' }),\n      plazoMes: () => this.set({ plazo: 'mes', sinPago: false }),\n      togSinPago: () => this.set({ sinPago: !s.sinPago, plazo: '12' })\n    };\n\n    // One visibility flag and one opener per detail section.\n    const ids = ['sec-1','sec-2','sec-3','sec-4','f1','f2','f3','f4','f5','f6',\n                 'sec-5','sec-6','sec-7','sec-8','sec-9','sec-10'];\n    ids.forEach(id => {\n      const key = id.replace('-', '');\n      v['show_' + key] = s.sel === id;\n      v['hide_' + key] = s.sel !== id;\n      v['on_' + key] = () => this.open(id);\n    });\n    return v;\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
  </script>
